<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReFound — Browse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <strong>ReFound</strong>
  <nav><a href="index.html">Report</a><a href="browse.html">Browse</a></nav>
</header>
<main>
  <div class="card">
    <h2>Browse reports</h2>
    <select id="filterType">
      <option value="">All types</option>
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select>
    <input id="filterSearch" placeholder="Search descriptions…">
    <button type="button" id="filterBtn">Search</button>
  </div>
  <div id="reportList"></div>
  <div id="matchPanel" class="card hidden"></div>
</main>
<script src="app.js"></script>
</body>
</html>
